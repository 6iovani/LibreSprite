name: Android

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup SDK
      run: |
        # android-actions/setup-android@v3 is archived and fails: it installs
        # the legacy "tools" package, which no longer exists in the SDK repo.
        SDK=/usr/local/lib/android/sdk
        mkdir -p "$SDK/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/ct.zip
        unzip -q /tmp/ct.zip -d "$SDK/cmdline-tools"
        mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
        yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
        "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
    - name: Setup tools
      run: |
        # sudo apt-get install cmake g++ libtinyxml2-dev ninja-build
        sudo apt-get update
        sudo apt-get install g++ libfreetype6-dev libgif-dev libjpeg-dev libpixman-1-dev libpng-dev libsdl2-dev libsdl2-image-dev libtinyxml2-dev libx11-dev libxcursor-dev ninja-build zlib1g-dev libarchive-dev
        # noble's apt cmake is 3.28 (the project needs >= 4.1) and system pip is PEP 668
        curl -fsSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz
        sudo tar -xzf /tmp/cmake.tar.gz -C /usr/local --strip-components=1
        mkdir build
        cd build
        cmake -G Ninja -DGEN_ONLY=ON ..
        ninja
        cd ..
    - name: Setup Submodule
      run: git clone https://github.com/LibreSprite/ls-android-deps.git android
    - name: Build Application
      run: |
        cd android
        CMAKEPATH=$(dirname $(dirname $(which cmake)))
        echo "cmake.dir=$CMAKEPATH" > local.properties
        sh ./gradlew --no-daemon --parallel build
        
    - name: Sign release APK
      run: |
        cd android

        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        APK=app/build/outputs/apk/all_in_one/release/app-all_in_one-release-unsigned.apk

        if [ ! -f "$APK" ]; then
          echo "::error::Release APK not found at $APK"
          find app/build/outputs -type f 2>/dev/null | head -50
          exit 1
        fi

        # Generate a temporary signing key for this build
        KEYSTORE_PASS=$(openssl rand -hex 16)

        keytool -genkeypair -noprompt \
          -keystore libresprite-temp.keystore \
          -storepass "$KEYSTORE_PASS" \
          -keypass "$KEYSTORE_PASS" \
          -alias libresprite \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=LibreSprite Test, O=LibreSprite, C=US"

        # Align the APK before signing
        "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$APK.aligned"
        mv "$APK.aligned" "$APK"

        # Sign the release APK
        "$BUILD_TOOLS/apksigner" sign \
          --ks libresprite-temp.keystore \
          --ks-key-alias libresprite \
          --ks-pass "pass:$KEYSTORE_PASS" \
          --key-pass "pass:$KEYSTORE_PASS" \
          "$APK"

        # Verify the signature
        "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

        # Rename to the final APK filename
        mv "$APK" app/build/outputs/apk/all_in_one/release/app-all_in_one-release.apk

        # Remove the temporary private key
        rm -f libresprite-temp.keystore

    
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: libresprite-android
        path: |
          android/app/build/outputs/apk/all_in_one/release/app-all_in_one-release.apk
